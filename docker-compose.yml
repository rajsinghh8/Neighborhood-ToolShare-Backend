name: sms-school

services:
  oracle:
    # gvenzl/oracle-free:23-slim wrapped with a startup guard (see docker/oracle/Dockerfile)
    # for hosts whose kernel.shmmax/shmall read as 2^64-1 (ORA-00600 [ksmcsg] /
    # ORA-27300 status 75). It is a no-op on normal hosts; SYS_ADMIN is only used by
    # the root-phase of the entrypoint to bind-mount sane values, then it drops to oracle.
    build:
      context: ./docker/oracle
    image: sms-school-oracle-free:23-slim
    cap_add:
      - SYS_ADMIN
    environment:
      - ORACLE_PASSWORD=${ORACLE_PASSWORD:-oraclepass}
      - APP_USER=${DB_USERNAME:-sms}
      - APP_USER_PASSWORD=${DB_PASSWORD:-smspass}
    shm_size: "2gb"
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/busybox su -s /bin/bash oracle -c healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  kafka:
    image: apache/kafka:4.3.1
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - "KAFKA_LISTENERS=CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:29092"
      - "KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://localhost:29092"
      - "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - SERVER_PORT=8000
      - DB_URL=jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      - DB_USERNAME=${DB_USERNAME:-sms}
      - DB_PASSWORD=${DB_PASSWORD:-smspass}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=${KAFKA_TOPIC:-student-events}
      - JWT_SECRET=${JWT_SECRET:-change-me-change-me-change-me-change-me-0123456789}
      - JWT_ACCESS_EXPIRY_MINUTES=${JWT_ACCESS_EXPIRY_MINUTES:-120}
      - JWT_REFRESH_EXPIRY_DAYS=${JWT_REFRESH_EXPIRY_DAYS:-7}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health > /dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: on-failure

volumes:
  oracle-data:
  kafka-data:
